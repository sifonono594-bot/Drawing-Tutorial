<body>

    <header>
        <h1>مِنصة الرّسام الإبداعية</h1>
        <p>طوّر مهاراتك في رسم الأنمي وتحدّ نفسك وتحكّم بأبعادك</p>
    </header>

    <div class="container">
        
        <div class="card">
            <h2>🎲 تحدي الرسم العشوائي</h2>
            <p style="color: var(--text-muted);">اضغط على الزر للحصول على فكرة رسم مبتكرة تكسر بها روتينك!</p>
            <div id="prompt-display">اضغط على الزر لبدء التحدي...</div>
            <button onclick="generatePrompt()">توليد فكرة جديدة</button>
        </div>

        <div class="card">
            <h2>📐 أداة شبكة الرسم (Grid Tool)</h2>
            <p style="color: var(--text-muted);">ارفع صورتك واختر حجم الشبكة لنقل الأبعاد بدقة على ورقك</p>
            
            <div class="controls">
                <label for="imageLoader" class="file-upload-btn">📁 اختر صورة</label>
                <input type="file" id="imageLoader" accept="image/*">
                
                <label for="gridSize">حجم الشبكة:</label>
                <select id="gridSize" onchange="updateGrid()">
                    <option value="4">4 × 4 (مبتدئ)</option>
                    <option value="6">6 × 6 (متوسط)</option>
                    <option value="8">8 × 8 (متقدم)</option>
                    <option value="12">12 × 12 (تفاصيل دقيقة)</option>
                </select>
            </div>

            <div class="canvas-container">
                <canvas id="imageCanvas"></canvas>
            </div>
        </div>

        <div class="ad-container">
            <script type="text/javascript">
                atOptions = {
                    'key' : '0bd2032e84d41e2b5db3d8ca5becc396',

                };

            <script type="text/javascript" src="//pl26053351.highratecpm.com/0bd2032e84d41e2b5db3d8ca5becc396/invoke.js"></script>
        </div>

    </div>

    <script>
        const prompts = [
            "ارسم شخصية أنمي ترتدي جلباباً مغربياً تقليدياً.",
            "ارسم شخصيتك المفضلة بملامح غاضبة جداً باستخدام 3 ألوان فقط.",
            "ارسم بطل أنمي في مواجهة ضد وحش آلي عملاق.",
            "ارسم عين أنمي واقعية جداً تلمع بداخلها النجوم.",
            "ارسم شخصية أنمي تعزف على آلة موسيقية في ليلة ممطرة.",
            "ارسم شخصية من اختراعك بأسلوب رسم استوديو جيبلي (Ghibli).",
            "تحدي: ارسم شخصية أنمي مستخدماً يدك غير المسيطرة (اليسرى مثلاً)!",
            "ارسم مقاتل ساموراي يستريح تحت شجرة كرز (ساكورا)."
        ];

        function generatePrompt() {
            const randomIndex = Math.floor(Math.random() * prompts.length);
            document.getElementById('prompt-display').innerText = prompts[randomIndex];
        }

        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        let uploadedImg = new Image();

        imageLoader.addEventListener('change', handleImage, false);

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedImg.onload = function() {
                    updateGrid();
                }
                uploadedImg.src = event.target.result;
            }
            if(e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        function updateGrid() {
            if (!uploadedImg.src) return;

            const maxWidth = 600;
            let width = uploadedImg.width;
            let height = uploadedImg.height;

            if (width > maxWidth) {
                height = (maxWidth / width) * height;
                width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            ctx.drawImage(uploadedImg, 0, 0, width, height);

            const gridSize = parseInt(document.getElementById('gridSize').value);
            
            ctx.strokeStyle = "rgba(239, 68, 68, 0.8)"; 
            ctx.lineWidth = 2;

            for (let i = 1; i < gridSize; i++) {
                let x = (width / gridSize) * i;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let i = 1; i < gridSize; i++) {
                let y = (height / gridSize) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }
    </script>
