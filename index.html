<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما الأصدقاء - النسخة السينمائية الملوكية 🍿💬</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        /* 🌌 تصميم كوني فضائي مستقر ولا يحجب الأزرار 🌌 */
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: radial-gradient(circle at center, #120824 0%, #05020a 100%); 
            color: #e2e8f0; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        /* الشاشة الرئيسية الملوكية */
        #home-screen { 
            width: 100%; 
            max-width: 450px; 
            background: #19112e; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 15px rgba(168, 85, 247, 0.2); 
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-sizing: border-box; 
            text-align: center; 
            margin-top: 5vh; 
        }

        .main-input-box {
            background: #22163d; 
            padding: 15px; 
            border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
        }

        .room-card { 
            background: #22163d; 
            padding: 12px 15px; 
            margin: 10px 0; 
            border-radius: 12px; 
            border: 1px solid rgba(168, 85, 247, 0.2); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: 0.2s; 
            text-align: right; 
        }
        .room-card:hover { 
            background: #2c1d4f; 
            border-color: #a855f7;
            transform: scale(1.02); 
        }
        
        .delete-btn { 
            background: rgba(239, 68, 68, 0.15); 
            color: #ef4444; 
            border: 1px solid rgba(239, 68, 68, 0.3); 
            font-size: 12px; 
            cursor: pointer; 
            padding: 6px 10px; 
            border-radius: 6px; 
            transition: 0.2s;
        }
        .delete-btn:hover {
            background: #ef4444;
            color: white;
        }

        .creators-footer { 
            margin-top: 25px; 
            font-size: 14px; 
            color: #94a3b8; 
            border-top: 1px dashed rgba(168, 85, 247, 0.3); 
            padding-top: 15px; 
        }
        .creators-footer span { color: #f59e0b; font-weight: bold; }
        .home-title { 
            margin-top: 0; 
            color: white; 
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        /* ستايل صفحة العرض والسينما */
        .container { 
            width: 100%; 
            max-width: 550px; 
            background: #19112e; 
            padding: 15px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 15px rgba(59, 130, 246, 0.1); 
            box-sizing: border-box; 
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.3s ease; 
        }
        
        .panel { 
            background: #22163d; 
            padding: 12px; 
            border-radius: 14px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        
        input, button { 
            padding: 11px; 
            border-radius: 8px; 
            border: none; 
            font-size: 14px; 
            margin: 4px 0; 
            box-sizing: border-box; 
        }
        input { 
            background: #0f081d; 
            color: white; 
            width: 100%; 
            border: 1px solid rgba(168, 85, 247, 0.2); 
        }
        input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
        }
        
        .btn-main { 
            background: linear-gradient(45deg, #e50914, #b00710); 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            box-shadow: 0 4px 10px rgba(229, 9, 20, 0.2);
            transition: 0.2s;
        }
        .btn-main:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(229, 9, 20, 0.4);
        }
        
        /* حاوية الفيديو والقفل */
        .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .video-overlay.locked { pointer-events: auto; }

        /* صندوق التحكم */
        .controls-box { background: #22163d; padding: 12px; border-radius: 14px; margin-top: 10px; border: 1px solid rgba(255, 255, 255, 0.05); text-align: center; }
        .btn-toggle { background: linear-gradient(45deg, #e50914, #ff3333); color: white; border: none; padding: 5px; border-radius: 50px; font-size: 20px; cursor: pointer; transition: 0.3s; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3); }
        .btn-toggle:hover { transform: scale(1.05); }
        .btn-toggle:active { transform: scale(0.9); }
        
        /* زر التدوير والوضع السينمائي */
        .btn-layout { background: #0f081d; color: white; border: 1px solid rgba(168, 85, 247, 0.3); padding: 5px; border-radius: 50px; font-size: 20px; cursor: pointer; transition: 0.3s; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; }
        .btn-layout:hover { background: #190e30; border-color: #a855f7; }
        .btn-layout:active { transform: scale(0.9); }
        
        /* شريط المشاهدة */
        .timeline-container { display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 10px; }
        .time-label { font-size: 12px; font-family: monospace; color: #94a3b8; }
        .custom-timeline { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: #475569; outline: none; }
        .custom-timeline::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #e50914; cursor: pointer; box-shadow: 0 0 8px #e50914; }

        /* الشات والمحادثات */
        .chat-box { background: #22163d; border-radius: 14px; margin-top: 15px; border: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; display: flex; flex-direction: column; }
        .chat-messages { height: 120px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #0b0516; }
        .msg { padding: 6px 10px; border-radius: 8px; max-width: 85%; font-size: 13px; }
        .msg.me { background: #3b82f6; align-self: flex-start; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3); }
        .msg.friend { background: #19112e; border: 1px solid rgba(255, 255, 255, 0.05); align-self: flex-end; }
        .chat-input-row { display: flex; padding: 5px; gap: 5px; }

        .peer-id-text { background: #0b0516; padding: 8px; border-radius: 6px; color: #f59e0b; font-family: monospace; text-align: center; font-size: 12px; cursor: pointer; border: 1px dashed rgba(245, 158, 11, 0.5); }
        
        .user-info-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .room-counter { background: #0f081d; padding: 8px 12px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 5px; white-space: nowrap; font-weight: bold; border: 1px solid rgba(168, 85, 247, 0.2); color: #c084fc; }

        /* 🎬 المظهر السينمائي المطور العريض 🎬 */
        .container.theater-mode {
            max-width: 1150px; 
            display: grid;
            grid-template-areas:
                "panel panel"
                "chat video"
                ". controls"; 
            grid-template-columns: 230px 1fr; 
            gap: 15px;
        }
        .container.theater-mode .panel { grid-area: panel; }
        .container.theater-mode .video-wrapper { grid-area: video; }
        .container.theater-mode .controls-box { grid-area: controls; margin-top: 10px; }
        
        .container.theater-mode .chat-box { grid-area: chat; margin-top: 0; height: 100%; display: flex; flex-direction: column; }
        .container.theater-mode .chat-messages { height: auto; flex-grow: 1; min-height: 100px; }
    </style>
</head>
<body>

    <div id="home-screen">
        <h1 class="home-title">🍿 سينما الأصدقاء</h1>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">مرحباً بك! يرجى إدخال اسمك أولاً ثم اختر إنشاء غرفة أو انضمام.</p>
        
        <input type="text" id="home-user-name" placeholder="اكتب اسمك هنا أولاً (للمحادثة)..." style="margin-bottom: 15px; border-color: #a855f7;">

        <div class="main-input-box">
            <input type="text" id="home-room-name" placeholder="اكتب اسم غرفتك الجديدة...">
            <button class="btn-main" onclick="createNewRoom()" style="margin-top: 5px;">إنشاء غرفة جديدة ➕</button>
        </div>

        <div class="main-input-box" style="border-color: rgba(59, 130, 246, 0.4);">
            <input type="text" id="home-friend-id" placeholder="أدخل كود الصديق المكون من 7 أرقام...">
            <button class="btn-main" onclick="joinFriendRoom()" style="background: linear-gradient(45deg, #3b82f6, #1d4ed8); margin-top: 5px; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2);">الانضمام لغرفة صديق 🔗</button>
        </div>

        <h3 style="font-size: 16px; border-bottom: 1px solid rgba(168, 85, 247, 0.3); padding-bottom: 10px; text-align: right; color: #f59e0b;">📌 غرفك المحفوظة على الجوال:</h3>
        <div id="savedRoomsList"></div>

        <div class="creators-footer">
            صُنع بحب بواسطة: <span>@modi</span> | <span>@sifali</span>
        </div>
    </div>

    <div id="room-screen" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        <h1 id="room-header-title">🍿 سينما الأصدقاء</h1>
        
        <div class="container">
            <div class="panel">
                <div class="user-info-row">
                    <button onclick="goHome()" style="background: #4b5563; color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold;">🏠 العودة للرئيسية</button>
                    <div class="room-counter">
                        👤 <span id="participant-count">1</span>
                    </div>
                </div>

                <input type="text" id="ytUrl" placeholder="رابط يوتيوب هنا...">
                <button class="btn-main" onclick="changeVideo()">تحديث الفيديو 🔄</button>
                <div id="my-id" class="peer-id-text" onclick="navigator.clipboard.writeText(this.innerText); alert('تم نسخ الكود!');">جاري التجهيز...</div>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="friend-id" placeholder="كود الصديق...">
                    <button onclick="connectToFriend()" style="background:#3b82f6; color:white;">اتصال</button>
                </div>
                
                <a href="https://discord.com/channels/@me" target="_blank" style="text-decoration: none; display: block; margin-top: 8px;">
                    <button type="button" style="background: #5865F2; color: white; width: 100%; font-weight: bold; cursor: pointer; margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 10px rgba(88, 101, 242, 0.3); transition: 0.2s;">
                        💬 فتح مكالمة ديسكورد (Discord)
                    </button>
                </a>
            </div>

            <div class="video-wrapper">
                <div id="overlay" class="video-overlay"></div>
                <div id="player"></div>
            </div>

            <div class="controls-box">
                <div class="timeline-container">
                    <span id="currentTime" class="time-label">00:00</span>
                    <input type="range" id="timeline" class="custom-timeline" min="0" max="100" value="0" oninput="timelineDragged(this.value)">
                    <span id="duration" class="time-label">00:00</span>
                </div>
                
                <div style="display: flex; justify-content: center; gap: 12px; align-items: center;">
                    <button id="toggleBtn" class="btn-toggle" onclick="togglePlay()">▶</button>
                    <button id="layoutBtn" class="btn-layout" onclick="toggleLayout()" title="تبديل العرض">↔️</button>
                </div>
            </div>

            <div class="chat-box">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="اكتب لرفيقك..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                    <button onclick="sendChatMessage()" style="background:#10b981; color:white;">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ------------------- نظام إدارة وحفظ الغرف الأساسي -------------------
        let peer = null;
        let conn = null;
        let myCustomId = null;

        window.onload = () => {
            if (localStorage.getItem('cinemaUserName')) {
                document.getElementById('home-user-name').value = localStorage.getItem('cinemaUserName');
            }
            loadSavedRooms();
        };

        function loadSavedRooms() {
            const rooms = JSON.parse(localStorage.getItem('cinemaRoomsList')) || [];
            const listDiv = document.getElementById('savedRoomsList');
            listDiv.innerHTML = '';
            
            if (rooms.length === 0) {
                listDiv.innerHTML = '<p style="color: #64748b; font-size: 13px; text-align:center;">لا توجد غرف محفوظة حالياً.</p>';
                return;
            }

            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';
                card.innerHTML = `
                    <div onclick="enterRoom('${room.id}', '${room.name}')" style="flex-grow: 1; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <span>📺</span> <strong style="color:white;">${room.name}</strong>
                    </div>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteRoom('${room.id}')">حذف ❌</button>
                `;
                listDiv.appendChild(card);
            });
        }

        function createNewRoom() {
            const userName = document.getElementById('home-user-name').value.trim();
            const roomName = document.getElementById('home-room-name').value.trim();
            
            if (!userName) return alert('يرجى كتابة اسمك أولاً لتقديمه في الشات!');
            if (!roomName) return alert('يرجى كتابة اسم للغرفة!');
            
            localStorage.setItem('cinemaUserName', userName);
            
            const newId = Math.floor(1000000 + Math.random() * 9000000).toString(); 
            const rooms = JSON.parse(localStorage.getItem('cinemaRoomsList')) || [];
            
            rooms.push({ id: newId, name: roomName });
            localStorage.setItem('cinemaRoomsList', JSON.stringify(rooms));
            
            document.getElementById('home-room-name').value = '';
            loadSavedRooms();
            enterRoom(newId, roomName);
        }

        function joinFriendRoom() {
            const userName = document.getElementById('home-user-name').value.trim();
            const friendId = document.getElementById('home-friend-id').value.trim();
            
            if (!userName) return alert('يرجى كتابة اسمك أولاً!');
            if (!friendId) return alert('يرجى كتابة كود الغرفة (كود صديقك)!');
            
            localStorage.setItem('cinemaUserName', userName);
            
            const tempMyId = Math.floor(1000000 + Math.random() * 9000000).toString();
            
            enterRoom(tempMyId, "اتصال مباشر");
            
            setTimeout(() => {
                document.getElementById('friend-id').value = friendId;
                connectToFriend();
            }, 1200);
            
            document.getElementById('home-friend-id').value = '';
        }

        function deleteRoom(id) {
            let rooms = JSON.parse(localStorage.getItem('cinemaRoomsList')) || [];
            rooms = rooms.filter(r => r.id !== id);
            localStorage.setItem('cinemaRoomsList', JSON.stringify(rooms));
            loadSavedRooms();
        }

        function enterRoom(roomId, roomName) {
            const userName = document.getElementById('home-user-name').value.trim();
            if (!userName) return alert('يرجى كتابة اسمك أولاً!');
            localStorage.setItem('cinemaUserName', userName);

            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('room-screen').style.display = 'flex';
            document.getElementById('room-header-title').textContent = `🍿 غرفتك: ${roomName}`;
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('participant-count').textContent = "1";

            if (peer) peer.destroy();
            
            myCustomId = roomId;
            peer = new Peer(myCustomId);
            
            peer.on('open', (id) => { document.getElementById('my-id').textContent = id; });
            peer.on('connection', (c) => { 
                conn = c; 
                setupSync(); 
            });
        }

        function goHome() {
            document.getElementById('room-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'block';
            
            document.querySelector('.container').classList.remove('theater-mode');
            document.getElementById('layoutBtn').textContent = '↔️';

            if (peer) {
                peer.destroy();
                peer = null;
            }
            if (player && typeof player.pauseVideo === 'function') {
                player.pauseVideo();
            }
            loadSavedRooms();
        }

        // ------------------- كود التشغيل والمزامنة واليوتيوب -------------------
        let player;
        let isPlaying = false;
        let isRemoteAction = false;
        const overlay = document.getElementById('overlay');
        const toggleBtn = document.getElementById('toggleBtn');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                videoId: 'EdhzTQD7hnU',
                playerVars: { 'controls': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady() {
            setInterval(() => {
                if (!player || isRemoteAction || !peer || peer.destroyed) return;
                const state = player.getPlayerState();
                
                if (state === 1 && !isPlaying) {
                    updateUI(true);
                    sendSignal({ type: 'play', time: player.getCurrentTime() });
                } 
                else if (state === 2 && isPlaying) {
                    updateUI(false);
                    sendSignal({ type: 'pause', time: player.getCurrentTime() });
                }
                updateTimeline();
            }, 100);
        }

        function togglePlay() {
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function toggleLayout() {
            const container = document.querySelector('.container');
            container.classList.toggle('theater-mode');
            const layoutBtn = document.getElementById('layoutBtn');
            
            if (container.classList.contains('theater-mode')) {
                layoutBtn.textContent = '📱'; 
                layoutBtn.setAttribute('title', 'العودة للوضع الطبيعي');
            } else {
                layoutBtn.textContent = '↔️'; 
                layoutBtn.setAttribute('title', 'تبديل للوضع السينمائي');
            }
        }

        function updateUI(play) {
            isPlaying = play;
            toggleBtn.textContent = play ? '⏸' : '▶';
            if (play) overlay.classList.add('locked');
            else overlay.classList.remove('locked');
        }

        function updateTimeline() {
            if (player && player.getDuration) {
                const cur = player.getCurrentTime();
                const dur = player.getDuration();
                document.getElementById('timeline').value = (cur / dur) * 100 || 0;
                document.getElementById('currentTime').textContent = formatTime(cur);
                document.getElementById('duration').textContent = formatTime(dur);
            }
        }

        function formatTime(s) {
            let m = Math.floor(s / 60); s = Math.floor(s % 60);
            return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
        }

        function connectToFriend() {
            const friendId = document.getElementById('friend-id').value.trim();
            if (!friendId) return;
            conn = peer.connect(friendId);
            
            conn.on('open', () => {
                const myName = localStorage.getItem('cinemaUserName') || "مجهول";
                sendSignal({ type: 'join', name: myName });
            });
            
            setupSync();
        }

        function setupSync() {
            conn.on('data', (data) => {
                if (data.type === 'join') {
                    appendNotification(`تم اتصال بالغرفة: ${data.name}`);
                    document.getElementById('participant-count').textContent = "2";
                    const myName = localStorage.getItem('cinemaUserName') || "مجهول";
                    sendSignal({ type: 'welcome', name: myName });
                    return;
                }
                if (data.type === 'welcome') {
                    appendNotification(`تم اتصال بالغرفة: ${data.name}`);
                    document.getElementById('participant-count').textContent = "2";
                    return;
                }
                if (data.type === 'chat') { appendMessage(data.text, 'friend'); return; }
                
                isRemoteAction = true; 
                if (data.type === 'play') {
                    player.seekTo(data.time, true);
                    player.playVideo();
                    updateUI(true);
                } else if (data.type === 'pause') {
                    player.pauseVideo();
                    player.seekTo(data.time, true);
                    updateUI(false);
                } else if (data.type === 'change') {
                    player.loadVideoById(data.id);
                } else if (data.type === 'seek') {
                    player.seekTo(data.time, true);
                }
                setTimeout(() => { isRemoteAction = false; }, 500);
            });

            conn.on('close', () => {
                document.getElementById('participant-count').textContent = "1";
                appendNotification("غادر الطرف الآخر الغرفة");
            });
        }

        function sendSignal(data) {
            if (conn && conn.open) conn.send(data);
        }

        function timelineDragged(v) {
            if (!player) return;
            const target = (v / 100) * player.getDuration();
            player.seekTo(target, true);
            sendSignal({ type: 'seek', time: target });
        }

        function sendChatMessage() {
            const val = document.getElementById('chatInput').value;
            if (!val) return;
            appendMessage(val, 'me');
            sendSignal({ type: 'chat', text: val });
            document.getElementById('chatInput').value = '';
        }

        function appendMessage(t, s) {
            const d = document.createElement('div');
            d.className = 'msg ' + s;
            d.textContent = t;
            const box = document.getElementById('chatMessages');
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        function appendNotification(text) {
            const d = document.createElement('div');
            d.style.cssText = "background: rgba(245, 158, 11, 0.15); color: #f59e0b; text-align: center; font-size: 13px; padding: 6px; border-radius: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; font-weight: bold;";
            d.textContent = text;
            const box = document.getElementById('chatMessages');
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        function changeVideo() {
            const url = document.getElementById('ytUrl').value;
            // استخراج الـ ID من الرابط سواء كان طويل (watch?v=) أو قصير (youtu.be/)
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            const id = (match && match[2].length === 11) ? match[2] : url.trim();

            if (id.length === 11) {
                player.loadVideoById(id);
                sendSignal({ type: 'change', id: id });
            } else {
                alert("يرجى إدخال رابط يوتيوب صحيح");
            }
        }
    </script>
</body>
</html>
